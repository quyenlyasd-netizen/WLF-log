<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeanLiFit Workout Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#ff8a00', // Neon orange
                            500: '#e57a00',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
        
        /* Smooth transitions */
        .card-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen selection:bg-brand-400 selection:text-white pb-20">

    <!-- Auth Section (Màn hình Đăng nhập/Đăng ký) -->
    <div id="auth-screen" class="max-w-md mx-auto px-4 mt-10 flex flex-col justify-center min-h-[70vh]">
        <div class="text-center mb-8">
            <i class="fa-solid fa-dumbbell text-brand-400 text-5xl mb-3"></i>
            <h1 class="text-3xl font-bold tracking-tight text-white uppercase italic">WeanLiFit</h1>
            <p class="text-gray-400 mt-2">Theo dõi tiến độ tập luyện của bạn</p>
        </div>
        
        <form id="auth-form" class="bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-xl space-y-4">
            <h2 id="auth-title" class="text-xl font-semibold text-center text-white mb-2">Đăng Nhập</h2>
            
            <div id="auth-error" class="hidden text-red-400 text-sm text-center bg-red-400/10 p-2 rounded-lg"></div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="auth-email" required placeholder="email@example.com" 
                       class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Mật khẩu</label>
                <input type="password" id="auth-password" required placeholder="••••••••" 
                       class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
            </div>
            
            <button type="submit" id="auth-submit-btn" class="w-full bg-brand-400 hover:bg-brand-500 text-gray-950 font-bold text-lg rounded-xl py-3 mt-4 transition-all active:scale-95 shadow-[0_0_15px_rgba(255,138,0,0.3)]">
                Đăng Nhập
            </button>
            
            <p class="text-center text-sm text-gray-400 mt-4">
                <span id="auth-toggle-text">Chưa có tài khoản?</span>
                <button type="button" id="auth-toggle-btn" class="text-brand-400 font-medium hover:underline">Đăng ký ngay</button>
            </p>
        </form>
    </div>

    <!-- Main App Screen (Giao diện chính - Bị ẩn khi chưa đăng nhập) -->
    <div id="main-app" class="hidden">
        <!-- Header -->
        <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-10 shadow-lg shadow-black/20">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-dumbbell text-brand-400 text-xl"></i>
                    <h1 class="text-xl font-bold tracking-tight text-white uppercase italic">WeanLiFit</h1>
                </div>
                <button id="logout-btn" class="text-sm text-gray-400 hover:text-brand-400 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
            
            <!-- Input Form Section -->
            <section class="bg-gray-900 rounded-2xl p-5 border border-gray-800 shadow-xl relative">
                <h2 class="text-lg font-semibold mb-4 text-gray-300 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-brand-400"></i> Thêm bài tập mới
                </h2>
                
                <form id="workout-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Buổi tập (Split)</label>
                        <select id="split-type" class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
                            <option value="Push">Push (Đẩy)</option>
                            <option value="Pull">Pull (Kéo)</option>
                            <option value="Legs">Legs (Chân)</option>
                            <option value="Upper">Upper (Thân trên)</option>
                            <option value="Lower">Lower (Thân dưới)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Tên bài tập</label>
                        <input type="text" id="exercise-name" required placeholder="VD: Incline Dumbbell Press" 
                               class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Mức tạ (kg)</label>
                            <input type="number" id="weight" step="0.5" min="0" required placeholder="0" 
                                   class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-3 py-3 text-center focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Số hiệp</label>
                            <input type="number" id="sets" min="1" required placeholder="0" 
                                   class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-3 py-3 text-center focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Số reps</label>
                            <input type="number" id="reps" min="1" required placeholder="0" 
                                   class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-3 py-3 text-center focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-colors">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-400 hover:bg-brand-500 text-gray-950 font-bold text-lg rounded-xl py-3.5 mt-2 transition-all transform active:scale-95 flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(255,138,0,0.3)]">
                        <i class="fa-solid fa-check"></i> LƯU BÀI TẬP
                    </button>
                </form>
            
            <!-- Notification Toast -->
            <div id="toast" class="hidden mt-3 bg-green-500/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-lg text-sm text-center font-medium">
                Đã lưu thành công!
            </div>
        </section>

        <!-- History Section -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-300 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-brand-400"></i> Lịch sử tập
                </h2>
                <button id="clear-all-btn" class="text-xs text-red-400 hover:text-red-300 font-medium px-2 py-1 bg-red-400/10 rounded-md transition-colors">
                    <i class="fa-solid fa-trash-can mr-1"></i> Xóa tất cả
                </button>
            </div>
            
            <!-- Custom modal for confirmation (since alert/confirm are not allowed) -->
            <div id="confirm-modal" class="hidden bg-gray-900 border border-red-500/30 rounded-xl p-4 mb-4 shadow-lg text-center">
                <p class="text-sm text-gray-300 mb-3">Bạn có chắc chắn muốn xóa toàn bộ lịch sử tập luyện không?</p>
                <div class="flex gap-2 justify-center">
                    <button id="cancel-clear" class="px-4 py-2 bg-gray-800 text-white text-sm rounded-lg hover:bg-gray-700">Hủy</button>
                    <button id="confirm-clear" class="px-4 py-2 bg-red-500/20 text-red-400 text-sm rounded-lg hover:bg-red-500/40">Chắc chắn xóa</button>
                </div>
            </div>

            <!-- List Container -->
            <div id="workout-list" class="space-y-3">
                <!-- Workout items will be injected here via JS -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-10 opacity-50">
                <i class="fa-solid fa-box-open text-4xl mb-3"></i>
                <p class="text-sm">Chưa có dữ liệu bài tập.<br>Hãy thêm bài tập đầu tiên của bạn!</p>
            </div>
        </section>
        
    </main>
    </div> <!-- Đóng thẻ main-app -->

    <!-- Chuyển script sang type="module" để dùng Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Khởi tạo Firebase từ config môi trường
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Biến trạng thái
        let STORAGE_KEY = '';
        let workouts = [];
        let isLoginMode = true;

        // DOM Elements - Auth
        const authScreen = document.getElementById('auth-screen');
        const mainApp = document.getElementById('main-app');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const authToggleText = document.getElementById('auth-toggle-text');
        const authTitle = document.getElementById('auth-title');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');

        // DOM Elements - App
        const form = document.getElementById('workout-form');
        const listContainer = document.getElementById('workout-list');
        const emptyState = document.getElementById('empty-state');
        const toast = document.getElementById('toast');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmClearBtn = document.getElementById('confirm-clear');
        const cancelClearBtn = document.getElementById('cancel-clear');

        // Logic Chuyển đổi giữa Form Đăng nhập và Đăng ký
        authToggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.textContent = 'Đăng Nhập';
                authSubmitBtn.textContent = 'Đăng Nhập';
                authToggleText.textContent = 'Chưa có tài khoản?';
                authToggleBtn.textContent = 'Đăng ký ngay';
            } else {
                authTitle.textContent = 'Tạo Tài Khoản Mới';
                authSubmitBtn.textContent = 'Đăng Ký';
                authToggleText.textContent = 'Đã có tài khoản?';
                authToggleBtn.textContent = 'Đăng nhập';
            }
            authError.classList.add('hidden');
        });

        // Logic Xử lý Submit Auth
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = authEmail.value;
            const password = authPassword.value;
            authError.classList.add('hidden');
            authSubmitBtn.disabled = true;
            authSubmitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang xử lý...';
            
            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                authError.textContent = error.message.replace('Firebase: ', '');
                authError.classList.remove('hidden');
            } finally {
                authSubmitBtn.disabled = false;
                authSubmitBtn.textContent = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký';
            }
        });

        // Nút Đăng Xuất
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Lắng nghe thay đổi trạng thái đăng nhập Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Đã đăng nhập: ẩn Auth, hiện App
                authScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                
                // QUAN TRỌNG: Tạo Storage Key độc nhất từ UID người dùng để cách ly dữ liệu
                STORAGE_KEY = 'weanlifit_data_' + user.uid;
                loadData();
            } else {
                // Đã đăng xuất / Chưa đăng nhập: hiện Auth, ẩn App
                authScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
                
                // Xoá memory chống lộ dữ liệu khi log ra
                workouts = [];
                listContainer.innerHTML = '';
                authEmail.value = '';
                authPassword.value = '';
            }
        });

        // Khôi phục dữ liệu từ LocalStorage bằng Unique Key
        function loadData() {
            workouts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            renderWorkouts();
        }

        // --- Các Logic Core Của Tracker Không Đổi ---
        function formatDate(isoString) {
            const date = new Date(isoString);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes} - ${day}/${month}`;
        }

        // Cập nhật lại LocalStorage bằng Unique Key
        function saveToStorage() {
            if (STORAGE_KEY) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(workouts));
            }
        }

        function renderWorkouts() {
            listContainer.innerHTML = '';
            
            if (workouts.length === 0) {
                emptyState.classList.remove('hidden');
                clearAllBtn.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                clearAllBtn.classList.remove('hidden');
                
                const sortedWorkouts = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                sortedWorkouts.forEach((workout, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-xl p-4 border border-gray-700/50 shadow-sm relative overflow-hidden card-enter';
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    let badgeColor = 'bg-gray-700 text-gray-300';
                    if(workout.split === 'Push') badgeColor = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                    else if(workout.split === 'Pull') badgeColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                    else if(workout.split === 'Legs') badgeColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';
                    else badgeColor = 'bg-brand-400/20 text-brand-400 border-brand-400/30';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-1 rounded-md border ${badgeColor}">
                                    ${workout.split}
                                </span>
                                <span class="text-xs text-gray-500 ml-2"><i class="fa-regular fa-clock"></i> ${formatDate(workout.date)}</span>
                            </div>
                            <button onclick="deleteSingleWorkout('${workout.id}')" class="text-gray-500 hover:text-red-400 p-1 transition-colors">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <h3 class="font-semibold text-lg text-white mb-3">${workout.name}</h3>
                        
                        <div class="grid grid-cols-3 gap-2 bg-gray-900/50 p-3 rounded-lg border border-gray-800">
                            <div class="text-center">
                                <p class="text-[10px] text-gray-400 uppercase tracking-wide">Mức tạ</p>
                                <p class="font-bold text-brand-400 text-lg">${workout.weight} <span class="text-xs font-normal">kg</span></p>
                            </div>
                            <div class="text-center border-l border-r border-gray-700/50">
                                <p class="text-[10px] text-gray-400 uppercase tracking-wide">Hiệp</p>
                                <p class="font-bold text-white text-lg">${workout.sets}</p>
                            </div>
                            <div class="text-center">
                                <p class="text-[10px] text-gray-400 uppercase tracking-wide">Reps</p>
                                <p class="font-bold text-white text-lg">${workout.reps}</p>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const split = document.getElementById('split-type').value;
            const name = document.getElementById('exercise-name').value.trim();
            const weight = document.getElementById('weight').value;
            const sets = document.getElementById('sets').value;
            const reps = document.getElementById('reps').value;

            if (!name) return;

            const newWorkout = {
                id: Date.now().toString(),
                date: new Date().toISOString(),
                split,
                name,
                weight: parseFloat(weight),
                sets: parseInt(sets),
                reps: parseInt(reps)
            };

            workouts.push(newWorkout);
            saveToStorage();
            renderWorkouts();
            
            document.getElementById('exercise-name').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('sets').value = '';
            document.getElementById('reps').value = '';
            
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);

            document.getElementById('exercise-name').focus();
        });

        // Gắn hàm deleteSingleWorkout vào Object Window để onclick trên HTML có thể gọi được
        window.deleteSingleWorkout = function(id) {
            workouts = workouts.filter(w => w.id !== id);
            saveToStorage();
            renderWorkouts();
        }

        // Các event cho modal xác nhận xoá tất cả
        clearAllBtn.addEventListener('click', () => {
            confirmModal.classList.remove('hidden');
            clearAllBtn.classList.add('hidden');
        });

        cancelClearBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            clearAllBtn.classList.remove('hidden');
        });

        confirmClearBtn.addEventListener('click', () => {
            workouts = [];
            saveToStorage();
            renderWorkouts();
            confirmModal.classList.add('hidden');
        });

    </script>
</body>
</html>
